const questions = [{"id": "T1-001", "source": "EXÁMEN LAAT TEORÍA T.1", "block": "Parcial 1 Teoría", "topic": "Conductores", "difficulty": "media", "type": "open", "question": "¿Por qué y para qué se emplean los conductores de aleación de aluminio zirconio?", "answer": "Para mejorar el comportamiento térmico, soportar mayores temperaturas/cargas y aumentar la capacidad de transporte en líneas aéreas de transporte y distribución.", "explanation": "Conductores de altas prestaciones térmicas: permiten transportar más corriente y soportar mayores temperaturas.", "tags": ["conductores", "aluminio-zirconio", "capacidad térmica"], "deepExplanation": {"correctAnswer": "Para mejorar el comportamiento térmico, soportar mayores temperaturas/cargas y aumentar la capacidad de transporte en líneas aéreas de transporte y distribución.", "whyCorrect": "Conductores de altas prestaciones térmicas: permiten transportar más corriente y soportar mayores temperaturas.", "whyWrong": "No hay distractores: tienes que reconstruir la idea completa con las palabras clave.", "mnemonic": "Conductores: cobre mínimo 10 mm²; aluminio-zirconio = mejores prestaciones térmicas."}}, {"id": "T1-002", "source": "EXÁMEN LAAT TEORÍA T.1", "block": "Parcial 1 Teoría", "topic": "Aisladores", "difficulty": "media", "type": "open", "question": "¿Qué ventajas e inconvenientes presenta el aislador de tipo polimérico (envolvente de silicona) frente a los aisladores de vidrio y porcelana?", "answer": "Ventajas principales: reducción sustancial del peso, mayor elasticidad de la envolvente, mayor resistencia en áreas de elevada contaminación y facilidad de aplicación como separadores de fases y como elementos componentes de apoyos en líneas aéreas compactas.", "explanation": "Clave: menor peso, envolvente flexible, buen comportamiento ante contaminación y uso en líneas compactas.", "tags": ["aisladores", "polimérico", "silicona", "contaminación"], "deepExplanation": {"correctAnswer": "Ventajas principales: reducción sustancial del peso, mayor elasticidad de la envolvente, mayor resistencia en áreas de elevada contaminación y facilidad de aplicación como separadores de fases y como elementos componentes de apoyos en líneas aéreas compactas.", "whyCorrect": "Clave: menor peso, envolvente flexible, buen comportamiento ante contaminación y uso en líneas compactas.", "whyWrong": "No hay distractores: tienes que reconstruir la idea completa con las palabras clave.", "mnemonic": "Polimérico: menor peso, mejor contaminación y líneas compactas."}}, {"id": "T1-003", "source": "EXÁMEN LAAT TEORÍA T.1", "block": "Parcial 1 Teoría", "topic": "Efecto corona", "difficulty": "media", "type": "open", "question": "Técnicamente, ¿por qué se produce el efecto corona?", "answer": "Si el potencial del conductor es elevado, el campo eléctrico en la superficie del conductor también es elevado. Si dicho campo eléctrico supera la rigidez dieléctrica del aire, se producen descargas en el aire, llamadas descargas corona.", "explanation": "Efecto corona = ionización del aire cuando E supera la rigidez dieléctrica.", "tags": ["efecto corona", "campo eléctrico", "rigidez dieléctrica"], "deepExplanation": {"correctAnswer": "Si el potencial del conductor es elevado, el campo eléctrico en la superficie del conductor también es elevado. Si dicho campo eléctrico supera la rigidez dieléctrica del aire, se producen descargas en el aire, llamadas descargas corona.", "whyCorrect": "Efecto corona = ionización del aire cuando E supera la rigidez dieléctrica.", "whyWrong": "No hay distractores: tienes que reconstruir la idea completa con las palabras clave.", "mnemonic": "Corona: E superficial supera la rigidez dieléctrica del aire."}}, {"id": "T1-004", "source": "EXÁMEN LAAT TEORÍA T.1", "block": "Parcial 1 Teoría", "topic": "Efecto corona", "difficulty": "baja", "type": "open", "question": "¿Qué es la tensión crítica disruptiva?", "answer": "Es la tensión para la cual el campo eléctrico alcanza la rigidez dieléctrica del aire.", "explanation": "Umbral de inicio de ionización del aire.", "tags": ["efecto corona", "tensión crítica disruptiva"], "deepExplanation": {"correctAnswer": "Es la tensión para la cual el campo eléctrico alcanza la rigidez dieléctrica del aire.", "whyCorrect": "Umbral de inicio de ionización del aire.", "whyWrong": "No hay distractores: tienes que reconstruir la idea completa con las palabras clave.", "mnemonic": "Corona: E superficial supera la rigidez dieléctrica del aire."}}, {"id": "T1-005", "source": "EXÁMEN LAAT TEORÍA T.1", "block": "Parcial 1 Teoría", "topic": "Efecto corona", "difficulty": "baja", "type": "open", "question": "¿Qué consecuencias tiene el efecto corona?", "answer": "Pérdidas de potencia, perturbaciones radioeléctricas y degradación de aislamientos de materiales compuestos.", "explanation": "Respuesta oficial centrada en pérdidas, perturbaciones radioeléctricas y degradación de aislamientos.", "tags": ["efecto corona", "pérdidas", "perturbaciones"], "deepExplanation": {"correctAnswer": "Pérdidas de potencia, perturbaciones radioeléctricas y degradación de aislamientos de materiales compuestos.", "whyCorrect": "Respuesta oficial centrada en pérdidas, perturbaciones radioeléctricas y degradación de aislamientos.", "whyWrong": "No hay distractores: tienes que reconstruir la idea completa con las palabras clave.", "mnemonic": "Corona: E superficial supera la rigidez dieléctrica del aire."}}, {"id": "T1-006", "source": "EXÁMEN LAAT TEORÍA T.1", "block": "Parcial 1 Teoría", "topic": "Documentación y puesta en servicio", "difficulty": "media", "type": "multiple", "question": "Las líneas eléctricas propiedad de empresas de transporte y distribución de energía eléctrica, para poder poner en servicio las mismas, deberán de disponer de la siguiente documentación:", "options": {"A": "Certificado final de obra por técnico competente", "B": "Proyecto y certificado", "C": "Inspección inicial por O.C.A., proyecto y certificado final de obra por técnico competente"}, "correct": "B", "explanation": "Para líneas propiedad de empresas de transporte y distribución: proyecto y certificado.", "tags": ["documentación", "puesta en servicio"], "deepExplanation": {"correctAnswer": "B) Proyecto y certificado", "whyCorrect": "Para líneas propiedad de empresas de transporte y distribución: proyecto y certificado.", "whyWrong": "Descarta las otras opciones porque no coinciden con la regla/fórmula/porcentaje marcado en el material.", "mnemonic": "Registro: busca la opción completa con instaladora autorizada + proyecto + dirección de obra + inspección si procede + mantenimiento."}}, {"id": "T1-007", "source": "EXÁMEN LAAT TEORÍA T.1", "block": "Parcial 1 Teoría", "topic": "Inspecciones y verificaciones", "difficulty": "baja", "type": "multiple", "question": "La verificación periódica de las líneas propiedad de empresas de transporte y distribución de energía eléctrica se realizará, al menos cada:", "options": {"A": "Dos años", "B": "Tres años", "C": "Cuatro años"}, "correct": "B", "explanation": "Periodicidad mínima: tres años.", "tags": ["verificación periódica"], "deepExplanation": {"correctAnswer": "B) Tres años", "whyCorrect": "Periodicidad mínima: tres años.", "whyWrong": "Descarta las otras opciones porque no coinciden con la regla/fórmula/porcentaje marcado en el material.", "mnemonic": "Inspecciones: si no es transporte/distribución y Un > 30 kV → organismo de control."}}, {"id": "T1-008", "source": "EXÁMEN LAAT TEORÍA T.1", "block": "Parcial 1 Teoría", "topic": "Inspecciones y verificaciones", "difficulty": "media", "type": "multiple", "question": "Las líneas que no sean propiedad de empresas de transporte y distribución de energía eléctrica, deberán verificarse, a fin de comprobar la correcta ejecución y funcionamiento seguro de la misma, por:", "options": {"A": "Una empresa instaladora cualquiera, con la supervisión del director de la obra.", "B": "La empresa instaladora autorizada que la ejecute, con la supervisión del director de obra.", "C": "Un organismo de control con el apoyo del director de obra."}, "correct": "B", "explanation": "Verifica la empresa instaladora autorizada que la ejecuta, con supervisión del director de obra.", "tags": ["verificación", "empresa instaladora autorizada"], "deepExplanation": {"correctAnswer": "B) La empresa instaladora autorizada que la ejecute, con la supervisión del director de obra.", "whyCorrect": "Verifica la empresa instaladora autorizada que la ejecuta, con supervisión del director de obra.", "whyWrong": "Descarta las otras opciones porque no coinciden con la regla/fórmula/porcentaje marcado en el material.", "mnemonic": "Inspecciones: si no es transporte/distribución y Un > 30 kV → organismo de control."}}, {"id": "T1-009", "source": "EXÁMEN LAAT TEORÍA T.1", "block": "Parcial 1 Teoría", "topic": "Inspecciones y verificaciones", "difficulty": "media", "type": "multiple", "question": "En líneas que no sean propiedad de empresas de transporte y distribución de energía eléctrica, si la tensión nominal fuera superior a 30 kV, la instalación deberá ser objeto de una inspección inicial por:", "options": {"A": "Una empresa instaladora autorizada", "B": "Un técnico titulado competente", "C": "Un organismo de control"}, "correct": "C", "explanation": "Si Un > 30 kV: inspección inicial por organismo de control.", "tags": ["OCA", "inspección inicial", "30 kV"], "deepExplanation": {"correctAnswer": "C) Un organismo de control", "whyCorrect": "Si Un > 30 kV: inspección inicial por organismo de control.", "whyWrong": "Descarta las otras opciones porque no coinciden con la regla/fórmula/porcentaje marcado en el material.", "mnemonic": "Inspecciones: si no es transporte/distribución y Un > 30 kV → organismo de control."}}, {"id": "T1-010", "source": "EXÁMEN LAAT TEORÍA T.1", "block": "Parcial 1 Teoría", "topic": "Documentación y puesta en servicio", "difficulty": "alta", "type": "multiple", "question": "En líneas que no sean propiedad de empresas d plicación guardada')}
function failedSummary(){return questions.filter(q=>qs(q.id).bad>0||state.openScores[q.id]==='bad').map(q=>`[${q.id}] ${q.topic}\n${q.question}\nCorrecta: ${q.type==='multiple'?q.correct+' — '+q.options[q.correct]:q.answer}\n`).join('\n')}function copyFailedSummary(){navigator.clipboard&&navigator.clipboard.writeText(failedSummary());alert('Resumen de fallos copiado')}function exportFailedTxt(){let blob=new Blob([failedSummary()||'Sin fallos registrados.'],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fallos_quiz_laat.txt';a.click()}function showAllAnswers(){document.getElementById('summaryContent').innerHTML='<h2>Respuestas completas</h2>'+questions.map(q=>review({q,a:state.answers[q.id],good:true,open:q.type==='open'})).join('');showOnly('summary')}function resetProgress(){if(confirm('¿Seguro que quieres borrar todo el progreso?')){state=def();save();applyTheme();showOnly('home')}}function exportProgress(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='progreso_quiz_laat_ultra.json';a.click()}
applyTheme();renderStats();
